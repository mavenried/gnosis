name: Release

# Fires on version tags like v3.4.0 (single digit per component, matching
# this project's current versioning scheme).
on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'

permissions:
  contents: write

jobs:
  native:
    name: Build native tarball
    runs-on: ubuntu-24.04
    # Ubuntu 24.04's packaged gjs (1.80) is older than this project's
    # required >= 1.82, and there's no newer LTS runner image available yet.
    # Arch Linux tracks upstream gjs directly and is already the reference
    # dependency list in the README, so build there instead.
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            git tar meson ninja pkgconf gettext \
            gjs gtk4 libadwaita webkitgtk-6.0 \
            desktop-file-utils appstream

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: ./build.sh native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-tarball
          path: dist/*.tar.gz

  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build
        run: ./build.sh flatpak

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: dist/*.flatpak

  release:
    name: Publish release
    needs: [native, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List built artifacts
        run: ls -lh dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
