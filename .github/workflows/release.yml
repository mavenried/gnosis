name: Release

# Fires on version tags like v3.4.0 (single digit per component, matching
# this project's current versioning scheme).
on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    # Ubuntu 24.04's packaged gjs (1.80) is older than this project's
    # required >= 1.82, and there's no newer LTS runner image available yet.
    # Arch Linux tracks upstream gjs directly and is already the reference
    # dependency list in the README, so build there instead.
    container: archlinux:latest
    steps:
      - name: Install build and packaging tools
        run: |
          pacman -Syu --noconfirm --needed \
            git tar meson ninja pkgconf gettext \
            gjs gtk4 libadwaita webkitgtk-6.0 \
            flatpak flatpak-builder \
            desktop-file-utils appstream github-cli

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native tarball
        run: ./build.sh native

      - name: Build Flatpak bundle
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive -y flathub org.gnome.Sdk//49 org.gnome.Platform//49
          ./build.sh flatpak

      - name: List built artifacts
        run: ls -lh dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
