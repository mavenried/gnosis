name: Release

# Fires on version tags like v3.3.0 (single digit per component, matching
# this project's current versioning scheme).
on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gettext \
            libgjs-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            desktop-file-utils appstream

      - name: Build native tarball
        run: ./build.sh native

      - name: Install Flatpak tooling
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build Flatpak bundle
        run: ./build.sh flatpak

      - name: List built artifacts
        run: ls -lh dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
