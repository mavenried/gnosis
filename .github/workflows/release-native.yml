name: Release native tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload to
        required: true
        type: string

permissions:
  contents: write

jobs:
  native:
    name: Build native tarball
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            git tar meson ninja pkgconf gettext \
            gjs gtk4 libadwaita webkitgtk-6.0 github-cli

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build artifact
        run: ./build.sh native

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Upload native tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
